<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Sorted Photography</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div style="padding-bottom: 20px; margin-bottom: 10px; border-bottom: 1px solid gray;">
            <button id="select-folder">Select Folder</button>
            <div id="folder-path"></div>
        </div>

        <div style="margin-bottom: 10px;">
            <div class="option flex">
                <input type="radio" id="option1" name="timezone-option" value="1"/>
                <div class="flex column">
                    <label for="option1">
                        Local Timezone &#8594; rename to different Timezone
                        <ul>
                            <li><small>Phone/DSLR was manually set to local timezone and you forgot to change it before or during travel. Photos were taken in a different timezone.</small></li>
                        </ul>
                    </label>
                </div>
            </div>

            <div class="option flex">
                <input type="radio" id="option2" name="timezone-option" value="2" />
                <div class="flex column">
                    <label for="option2">
                        Correct Timezone &#8594; rename to same Timezone
                        <ul>
                            <li><small>Phone/DSLR auto-detects timezone. Photos were taken in the correct timezone.</small></li>
                        </ul>
                    </label>
                </div>
            </div>
        </div>

        <div>
            <input id="country" type="text" placeholder="Country (e.g., US, JP, CN)" />
            <button id="list-timezones">List all timezones</button>
            <p id="timezones"></p>
            <input id="convert-to" type="text" placeholder="Timezone to convert to" />
        </div>

        <div style="padding-top: 20px; margin-top: 10px; border-top: 1px solid gray; display: flex;">
            <button id="rename-files">Rename Files</button>
            <div id="status" style="margin-left: 10px;"></div>
        </div>

        <script src="renderer.js"></script>
    </body>
</html>
